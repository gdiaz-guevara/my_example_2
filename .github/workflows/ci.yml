name: Code Quality QA Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-qa-validation:
    name: Execute Static Quality Constraints
    runs-on: ubuntu-latest

    steps:
      # CORRECCIÓN DE ORDEN: Primero clonamos de forma obligatoria los archivos en el disco del Runner
      - name: Checkout Source Code Repository Artifacts
        uses: actions/checkout@v4

      # Ahora que el repositorio ya existe en el Runner, la caché puede escanear el requirements.txt sin romperse
      - name: Initialize Isolated Python Environment Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # Instalamos las dependencias de forma limpia desde el manifiesto versionado
      - name: Provision Core Static QA Framework Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Orchestrated Pre-Commit Interception Matrix
        run: pre-commit run --all-files

      - name: Execute Independent Flake8 Semantic Analysis Verification
        run: |
          flake8 . --max-line-length=88 --extend-ignore=E203,E501
